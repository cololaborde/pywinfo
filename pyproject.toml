[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hwinfo-dashboard"
version = "0.1.0"
description = "Dashboard HTML con la información de hardware del sistema (hwinfo, lsblk, lscpu, dmidecode, ip)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
hwinfo-dashboard = "src.__main__:main"

[tool.setuptools]
packages = [
    "src",
    "src.collectors",
    "src.report",
]

[tool.setuptools.package-data]
"src.report" = [
    "template.html",
    "assets/*.css",
    "assets/*.js",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]